name: Update flake.lock

on:
  schedule:
    # Every Monday at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Update flake.lock
        run: nix flake update --extra-experimental-features 'nix-command flakes'
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update flake.lock'
          branch: 'auto/flake-update'
          delete-branch: true
          title: 'chore: weekly flake.lock update'
          body: |
            Automated weekly update of `flake.lock` inputs.

            Triggered by the `update-flake` workflow.

            Please review changes to `nixpkgs` carefully — bump the pinned
            `nixos-*` channel in `flake.nix` manually if a new stable release
            is available.
          labels: 'maintenance'
