name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    # Passed as NIX_CONFIG rather than through the installer's
    # `extra_nix_config`, whose values never reached the resolved substituter
    # list on the runner. Confirmed by printing `nix config show
    # substituters`: only cache.nixos.org and the project cache appeared, so
    # every CUDA path was fetched from NVIDIA and NCCL rebuilt from source.
    env:
      NIX_CONFIG: |
        extra-substituters = https://cache.nixos-cuda.org https://nix-community.cachix.org
        extra-trusted-public-keys = cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          # The flake declares these substituters too, but Nix refuses to
          # honor `nixConfig` for an untrusted user, so they are set above.
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v15
        with:
          name: tue-p8n
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          # Push new derivations to the cache so subsequent runs are faster.
          pushFilter: '-source$'
        # Allow the step to be skipped if the secret is not configured yet.
        continue-on-error: ${{ secrets.CACHIX_AUTH_TOKEN == '' }}

      # Instantiates every flake output. This is what catches the breakage a
      # change to this repository can actually cause: broken module wiring, a
      # renamed attribute, an evaluation that throws.
      #
      # `nix flake check --no-build` is the obvious command and does not work
      # here. The Nix-LD hook reads the compiler wrapper's dynamic-linker file
      # during evaluation, and `--no-build` refuses to realize the store path
      # that read needs, so evaluation fails on a cold store. Forcing
      # `drvPath` permits that one small realization and builds no outputs.

      # Temporary: the environments run substituted nothing from the CUDA
      # cache even though the paths it needed are in it. Print what the
      # runner actually resolves. Remove once the cause is known.
      - name: Show resolved substituters
        run: |
          nix config show substituters
          nix config show trusted-public-keys
          nix path-info --store https://cache.nixos-cuda.org \
            /nix/store/w0dx8iw00mxlb25r8i6b70yyrvcjfrh0-cuda12.9-nccl-2.28.7-1 \
            && echo "CUDA CACHE REACHABLE" || echo "CUDA CACHE NOT REACHABLE"

      - name: Evaluate all flake outputs
        run: |
          for output in checks devShells packages; do
            nix eval --raw ".#$output.x86_64-linux" \
              --apply 'set: builtins.concatStringsSep "\n" (map (d: d.drvPath) (builtins.attrValues set))' \
              > /dev/null
          done
          nix eval --json .#templates \
            --apply 'builtins.mapAttrs (_: t: { inherit (t) description; path = toString t.path; })' \
            > /dev/null

      # Everything below builds without a CUDA, ROCm, or TeX Live toolchain.
      # The shells that need one are realized by the environments workflow
      # instead, because whether they build is a property of the pinned
      # nixpkgs rather than of the change under review.
      - name: Build the accelerator-free checks
        run: |
          nix build -L --keep-going \
            .#checks.x86_64-linux.unit \
            .#checks.x86_64-linux.flake-module \
            .#checks.x86_64-linux.uv2nix \
            .#checks.x86_64-linux.treefmt \
            .#checks.x86_64-linux.pre-commit \
            .#checks.x86_64-linux.test-uv \
            .#checks.x86_64-linux.test-template \
            .#checks.x86_64-linux.shell-default \
            .#checks.x86_64-linux.shell-uv-cpu
