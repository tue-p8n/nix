name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v15
        with:
          name: tue-p8n
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          # Push new derivations to the cache so subsequent runs are faster.
          pushFilter: '-source$'
        # Allow the step to be skipped if the secret is not configured yet.
        continue-on-error: ${{ secrets.CACHIX_AUTH_TOKEN == '' }}
      - name: Nix Flake Check
        run: nix flake check --extra-experimental-features 'nix-command flakes' --keep-going
