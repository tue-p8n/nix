name: Environments

# Realizing the accelerator and TeX Live shells answers one question: can the
# pinned nixpkgs still build these environments? That answer changes when the
# lockfile moves, not when a module or a template changes, so this runs on
# lockfile changes, weekly, and on demand rather than on every push.
on:
  # The lockfile updater opens its pull request with `GITHUB_TOKEN`, and
  # GitHub starts no workflow runs from events that token creates, so the
  # `pull_request` trigger never sees it. Running on push to main is what
  # actually covers a lockfile bump.
  push:
    branches: [ main ]
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'shells/**'
      - 'lib/**'
  pull_request:
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'shells/**'
      - 'lib/**'
  schedule:
    # Mondays at 05:00 UTC. Scheduled runs use the default branch, so this
    # reports on main rather than on any open pull request.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Set here rather than through the installer's `extra_nix_config`, whose
# values never reached the resolved substituter list on the runner. The
# project cache is listed too so the coverage report below sees what the
# build jobs will actually be able to fetch.
env:
  NIX_CONFIG: |
    extra-substituters = https://cache.nixos-cuda.org https://nix-community.cachix.org https://tue-p8n.cachix.org
    extra-trusted-public-keys = cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= tue-p8n.cachix.org-1:OshT9P6F/UKw2M+vS11uEqih37k/hYF8K3RtIKrZfJs=

jobs:
  # Derives the matrix from the flake so a newly added shell is covered
  # without editing this file. Only the checks the per-push gate already
  # builds are excluded.
  discover:
    runs-on: ubuntu-24.04
    outputs:
      attrs: ${{ steps.list.outputs.attrs }}
    steps:
      # On `pull_request` this checks out the merge ref, so a shell added by
      # the pull request is present here and lands in the matrix. Pinning this
      # to the head commit instead would drop the merge with the base branch.
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - id: list
        env:
          # Mirrors the build step in `ci.yml`, which is the authoritative
          # list. A name left here after it leaves that step drops the check
          # from both workflows, so keep the two in step.
          COVERED_BY_CI: >-
            ["unit","flake-module","uv2nix","treefmt","pre-commit",
             "test-uv","test-template","shell-default","shell-uv-cpu"]
        run: |
          # `pipefail` matters here: without it a failed `nix eval` leaves jq
          # reading empty stdin, jq exits 0, and the real error surfaces as a
          # `fromJSON` failure in a different job with no trace of the cause.
          set -euo pipefail

          # Enforce the coupling the comment above describes. A name listed
          # there that no longer appears in the CI build step would be
          # excluded from this matrix and built by neither workflow.
          for name in $(jq -r '.[]' <<<"$COVERED_BY_CI"); do
            grep -q "checks\.x86_64-linux\.$name\b" .github/workflows/ci.yml || {
              echo "COVERED_BY_CI lists '$name', which ci.yml no longer builds" >&2
              exit 1
            }
          done

          nix eval --json .#checks.x86_64-linux --apply builtins.attrNames \
            | jq -c --argjson skip "$COVERED_BY_CI" '
                [ .[]
                | select(. as $n | $skip | index($n) == null)
                | "checks.x86_64-linux." + .
                ]
                + ["packages.x86_64-linux.oci-pytorch2_8_0-cuda12_9-cudnn9-devel"]
              ' > attrs.json
          test -s attrs.json
          cat attrs.json
          echo "attrs=$(cat attrs.json)" >> "$GITHUB_OUTPUT"

      # How much of the matrix the caches can serve, reported before the heavy
      # jobs start. A lockfile bump that lands on packages no cache has built
      # shows up here as a large build count, rather than as an hour-long cell
      # discovered later.
      - name: Report cache coverage
        run: |
          set -uo pipefail
          mapfile -t attrs < <(jq -r '.[] | ".#" + .' attrs.json)
          nix build --dry-run "${attrs[@]}" > dry.txt 2>&1 || true
          read -r builds fetches < <(awk '
            /will be built:/  { sec="build"; next }
            /will be fetched/ { sec="fetch"; next }
            /^  \/nix\/store\// { if (sec) c[sec]++; next }
            { sec="" }
            END { printf "%d %d\n", c["build"]+0, c["fetch"]+0 }
          ' dry.txt)
          {
            echo "| matrix closure | paths |"
            echo "| --- | --- |"
            echo "| substitutable from a cache | $fetches |"
            echo "| must be built | $builds |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "substitutable=$fetches to-build=$builds"
          if [ "$builds" -gt 0 ]; then
            echo "::notice::$builds derivations are in no configured cache"
            sed -n '/will be built:/,/will be fetched/p' dry.txt | head -25
          fi

  build:
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      # One CUDA version failing upstream should not hide the state of the
      # others, which is the whole reason this is a matrix.
      fail-fast: false
      matrix:
        attr: ${{ fromJSON(needs.discover.outputs.attrs) }}
    steps:
      - uses: actions/checkout@v4

      # A CUDA toolchain closure alone is larger than the space the runner
      # image leaves free, and NCCL needs several gigabytes of scratch on top.
      # Dropping the preinstalled language toolchains recovers roughly 25 GB.
      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v15
        with:
          name: tue-p8n
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          # Only the default CUDA version is covered by a public cache. This
          # push populates the rest, which otherwise cost a from-source NCCL
          # build on every run.
          pushFilter: '-source$'
        continue-on-error: ${{ secrets.CACHIX_AUTH_TOKEN == '' }}

      - name: Build ${{ matrix.attr }}
        run: nix build -L .#${{ matrix.attr }}
