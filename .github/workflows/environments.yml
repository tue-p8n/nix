name: Environments

# Realizing the accelerator and TeX Live shells answers one question: can the
# pinned nixpkgs still build these environments? That answer changes when the
# lockfile moves, not when a module or a template changes, so this runs on
# lockfile changes, weekly, and on demand rather than on every push.
on:
  schedule:
    # Mondays at 05:00 UTC, after the lockfile update pull request opens.
    - cron: '0 5 * * 1'
  pull_request:
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'shells/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Derives the matrix from the flake so a newly added shell is covered
  # without editing this file. Only the checks the per-push gate already
  # builds are excluded.
  discover:
    runs-on: ubuntu-24.04
    outputs:
      attrs: ${{ steps.list.outputs.attrs }}
    steps:
      # On `pull_request` this checks out the merge ref, so a shell added by
      # the pull request is present here and lands in the matrix. Pinning this
      # to the head commit instead would drop the merge with the base branch.
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - id: list
        env:
          # Mirrors the build step in `ci.yml`, which is the authoritative
          # list. A name left here after it leaves that step drops the check
          # from both workflows, so keep the two in step.
          COVERED_BY_CI: >-
            ["unit","flake-module","uv2nix","treefmt","pre-commit",
             "test-uv","test-template","shell-default","shell-uv-cpu"]
        run: |
          nix eval --json .#checks.x86_64-linux --apply builtins.attrNames \
            | jq -c --argjson skip "$COVERED_BY_CI" '
                [ .[]
                | select(. as $n | $skip | index($n) == null)
                | "checks.x86_64-linux." + .
                ]
                + ["packages.x86_64-linux.oci-pytorch2_8_0-cuda12_9-cudnn9-devel"]
              ' | tee attrs.json
          echo "attrs=$(cat attrs.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      # One CUDA version failing upstream should not hide the state of the
      # others, which is the whole reason this is a matrix.
      fail-fast: false
      matrix:
        attr: ${{ fromJSON(needs.discover.outputs.attrs) }}
    steps:
      - uses: actions/checkout@v4

      # A CUDA toolchain closure alone is larger than the space the runner
      # image leaves free, and NCCL needs several gigabytes of scratch on top.
      # Dropping the preinstalled language toolchains recovers roughly 25 GB.
      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            extra-substituters = https://cache.nixos-cuda.org https://nix-community.cachix.org
            extra-trusted-public-keys = cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
      - uses: cachix/cachix-action@v15
        with:
          name: tue-p8n
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          # Only the default CUDA version is covered by a public cache. This
          # push populates the rest, which otherwise cost a from-source NCCL
          # build on every run.
          pushFilter: '-source$'
        continue-on-error: ${{ secrets.CACHIX_AUTH_TOKEN == '' }}

      - name: Build ${{ matrix.attr }}
        run: nix build -L .#${{ matrix.attr }}
