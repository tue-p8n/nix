# prek configuration
# See https://prek.j178.dev/ for documentation

hooks:
  - id: alejandra
    name: Alejandra
    entry: alejandra
    files: '\.nix$'
    
  - id: nix-flake-check
    name: Nix Flake Check
    entry: nix flake check --extra-experimental-features 'nix-command flakes'
    pass_filenames: false
